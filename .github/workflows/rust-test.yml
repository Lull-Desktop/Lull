name: Rust tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust tests (Windows / MSVC)
    strategy:
      fail-fast: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache: true

      - name: Run tests
        # 原生 media-pp 后端是可选 feature（需要 FFmpeg 8.0.1 + libclang），
        # 默认 CI 不带它；预览构建用 --features native-media 单独验证。
        run: cargo test --all
        working-directory: src-tauri
