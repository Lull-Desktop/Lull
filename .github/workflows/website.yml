# 网站（Astro）构建与发布到 GitHub Pages。
#
# 触发条件刻意收窄，避免「改一行 Rust 就重建整个宣传站」：
#   - website/**            → 站点源码变了，必须重建
#   - package.json / tauri.conf.json → 下载页显示的版本号来自这些文件，版本变了要同步
#   - Release published     → 新的安装包上线，重置下载元数据
#   - 工作流自身改动        → 验证流水线
# 应用代码（src/、src-tauri/src/）位于上述路径之外，改这些不会触发本工作流。
# 如果哪天站点不再依赖版本号，把 package.json / tauri.conf.json 两行删掉即可。

name: Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "src-tauri/tauri.conf.json"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  release:
    types:
      - published
  workflow_dispatch:

# GitHub Pages 发布所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支的多次推送只保留最后一次；PR 的新提交会取消旧的构建。
# 部署本身由 environment: github-pages 串行化。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Astro 7 要求 Node >= 22.23.4，比仓库根的 .node-version（22）更严格，
  # 所以这里显式用 24，避免跟随应用侧升级时踩到引擎限制。
  NODE_VERSION: "24"

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 版本取自仓库根 package.json 的 packageManager（pnpm@11.x），不用手写。
      # 缓存只跟着 website 的 lockfile 走，和应用侧互不干扰。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      # 从 GitHub Release 读取版本号与安装包文件名，写进 src/data/release.json。
      # 还没有 release 时脚本会退化成兜底数据，不会让构建失败。
      - name: Resolve release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-release.mjs

      - name: Type-check
        run: pnpm check

      # Astro 构建本身就会校验路由与内容集合；check 加上类型层，覆盖脚本与组件 props。
      - name: Build site
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PR 只验证构建，不发布
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
