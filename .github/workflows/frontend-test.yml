# Installs Node.js dependencies and pnpm, then runs unit tests and content checks.

name: Frontend tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "src-tauri/**"
      - "README.md"

jobs:
  frontend-tests:
    name: Frontend tests
    strategy:
      fail-fast: true
    runs-on: windows-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend and SDK contracts
        run: pnpm typecheck

      - name: Type-check SDK packages
        run: pnpm widgets:sdk:check && pnpm scenes:sdk:check

      - name: Run tests
        run: pnpm test

      - name: Validate content catalog
        run: pnpm content:check

      - name: Validate scripted scene example
        run: pnpm scenes:samples:check

      - name: Validate widget manifests
        run: pnpm widgets:check
