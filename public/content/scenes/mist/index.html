<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雾岚 · Lull 社区场景</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #dbe8e4;
        --mist: rgba(196, 224, 218, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background:
          radial-gradient(900px 600px at 24% 12%, rgba(150, 196, 188, 0.18), transparent 62%),
          radial-gradient(760px 520px at 82% 78%, rgba(88, 128, 124, 0.24), transparent 68%),
          linear-gradient(158deg, #0a1416 0%, #0e1d1e 48%, #071011 100%);
        color: var(--ink);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .mist {
        position: absolute;
        left: -12%;
        width: 124%;
        height: 22%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--mist), transparent);
        filter: blur(28px);
        animation: drift 32s ease-in-out infinite;
        will-change: transform, opacity;
      }
      .mist.a { top: 44%; animation-duration: 29s; }
      .mist.b { top: 62%; opacity: 0.7; animation-duration: 41s; animation-direction: reverse; }
      .mist.c { top: 76%; opacity: 0.45; animation-duration: 51s; }
      .ridge {
        position: absolute;
        inset: auto 0 0 0;
        height: 56%;
        background: linear-gradient(180deg, rgba(13, 27, 27, 0.35), rgba(4, 9, 10, 0.92));
        clip-path: polygon(0 62%, 9% 48%, 18% 58%, 29% 34%, 41% 50%, 54% 28%, 67% 48%, 79% 38%, 90% 52%, 100% 44%, 100% 100%, 0 100%);
      }
      .ridge.back {
        height: 64%;
        opacity: 0.55;
        transform: translateY(8%);
        clip-path: polygon(0 70%, 12% 54%, 24% 64%, 37% 42%, 52% 58%, 65% 36%, 78% 54%, 89% 46%, 100% 56%, 100% 100%, 0 100%);
      }
      .copy {
        position: absolute;
        left: clamp(28px, 5vw, 64px);
        top: clamp(28px, 7vh, 64px);
        max-width: 70vw;
      }
      .brand {
        font-size: clamp(30px, 3.2vw, 46px);
        letter-spacing: 0.42em;
        font-weight: 300;
        opacity: 0.9;
      }
      h1 {
        margin: 14px 0 8px;
        font-family: "Songti SC", "SimSun", serif;
        font-size: clamp(38px, 5vw, 76px);
        font-weight: 400;
        letter-spacing: 0.16em;
      }
      p { margin: 0; color: rgba(219, 232, 228, 0.62); letter-spacing: 0.2em; font-size: 13px; }
      .badge {
        position: absolute;
        right: 22px;
        bottom: 18px;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(219, 232, 228, 0.45);
      }
      @keyframes drift {
        0%, 100% { transform: translate3d(-3%, 0, 0); opacity: 0.55; }
        50% { transform: translate3d(3%, 0, 0); opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mist { animation: none; }
      }
    </style>
  </head>
  <body data-scene="community.mist">
    <div class="mist a"></div>
    <div class="mist b"></div>
    <div class="mist c"></div>
    <div class="ridge back"></div>
    <div class="ridge"></div>
    <div class="copy">
      <div class="brand">LULL</div>
      <h1>雾岚</h1>
      <p>社区场景包 · 纯静态 HTML / CSS</p>
    </div>
    <div class="badge">MIST · COMMUNITY</div>
  </body>
</html>
