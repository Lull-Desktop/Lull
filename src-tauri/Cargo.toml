[package]
name = "lull"
version = "0.1.0"
description = "Lull — an open-source sleep & focus desktop companion"
authors = ["Lull contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建期解析 src/widgets/manifests/*.json，生成 window_host::spec 的静态描述。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生桌面宿主（lull_native.dll）通过 libloading 进程内加载。
libloading = "0.8"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rfd = { version = "0.16", default-features = false }

[target.'cfg(windows)'.dependencies]
# 无边框窗口用一次 SetWindowPos 同时改位置和尺寸，避免两帧之间闪烁。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[lints.rust]
# FFI 与 Win32 调用集中在 wallpaper/ffi.rs、wallpaper/windows.rs 等模块，
# 模块顶部用 `#![allow(unsafe_code)]` 局部豁免；其余代码保持 forbid 级别的约束。
unsafe_code = "deny"

[workspace.lints.clippy]
# Deny all warnings - treat them as errors
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unimplemented items can be left as warnings
todo = "warn"
unimplemented = "warn"

# Correctness (deny)
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# Performance (warn/deny)
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
needless_pass_by_value = "warn"

# Style (warn)
missing_errors_doc = "warn"
missing_panics_doc = "warn"
