[package]
name = "lull"
version = "0.2.2"
description = "Lull — an open-source sleep & focus desktop companion"
authors = ["Lull contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建期解析 src/widgets/manifests/*.json，生成 window_host::spec 的静态描述。
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生桌面宿主（lull_native.dll）通过 libloading 进程内加载。
libloading = "0.8"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# 社区发布者签名：Ed25519 + 标准 base64。只做验签，不生成密钥。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
base64 = "0.22"
rfd = { version = "0.16", default-features = false }
# 本地音乐资料库：SQLite + 迁移。SQLx 只使用运行时查询（不用 query! 宏），
# 避免构建期依赖 DATABASE_URL；SQLite 由 crate 自带。
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
# 音频标签 / 时长 / 内嵌封面 / 内嵌歌词读取；只读，不写回用户文件。
lofty = "0.25"
# 目录扫描与 Windows 路径规范化。
walkdir = "2"
dunce = "1"
# 侧车歌词的 GBK / UTF-16 兜底解码。
encoding_rs = "0.8"
# 稳定实体 ID（UUIDv7 按时间有序）。
uuid = { version = "1", features = ["v4", "v7"] }
# 艺术家/专辑名称规范化；与 SQLite 的 lower() 不同，CJK/重音字符也稳定。
unicode-normalization = "0.1"

[features]
default = []
# 原生共享解码是预览能力：需要 FFmpeg 8.0.1 + libclang + lull_native.dll 的
# TextureStream 导出，且运行环境必须支持 CreateTextureStream。默认构建保持
# HTML <video>，不让普通用户/CI 被 100MB 级依赖卡住。
native-media = ["dep:media-pp"]

[target.'cfg(windows)'.dependencies]
# 原生视频后端：media-pp 0.4.1 + FFmpeg 8.0.1 + D3D11/WebView2 TextureStream。
# 只在 `--features native-media` 时编译；构建需要 FFMPEG_DIR（8.0.x 头文件/
# 导入库）与 LIBCLANG_PATH（bindgen）；运行期需要 FFmpeg DLL 与 lull.exe 同目录。
# 接入与验收见 docs/media-runtime.md。
media-pp = { version = "=0.4.1", features = ["d3d11"], optional = true }
# 无边框窗口用一次 SetWindowPos 同时改位置和尺寸，避免两帧之间闪烁。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[lints.rust]
# FFI 与 Win32 调用集中在 wallpaper/ffi.rs、wallpaper/windows.rs 等模块，
# 模块顶部用 `#![allow(unsafe_code)]` 局部豁免；其余代码保持 forbid 级别的约束。
unsafe_code = "deny"

[workspace.lints.clippy]
# Deny all warnings - treat them as errors
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unimplemented items can be left as warnings
todo = "warn"
unimplemented = "warn"

# Correctness (deny)
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# Performance (warn/deny)
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
needless_pass_by_value = "warn"

# Style (warn)
missing_errors_doc = "warn"
missing_panics_doc = "warn"
