<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living World Controller</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <div>
          <p class="eyebrow">GAME CONTROLLER</p>
          <h1 class="title">Living World</h1>
        </div>
        <span class="badge" id="status">连接中</span>
      </header>

      <section class="stats">
        <div>
          <span class="label">水位</span>
          <strong id="water">--</strong>
        </div>
        <div>
          <span class="label">植物</span>
          <strong id="plants">--</strong>
        </div>
        <div>
          <span class="label">revision</span>
          <strong id="revision">--</strong>
        </div>
      </section>

      <section class="actions">
        <button type="button" id="plant" class="primary">种一棵</button>
        <button type="button" id="water" class="secondary">浇水</button>
      </section>

      <ul class="log" id="log" aria-label="事件日志"></ul>
      <p class="error" id="error" role="alert"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
