<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流萤 · 内容包测试</title>
    <style>
      /* Lull 外部场景：纯静态 HTML/CSS，运行在 sandbox iframe 里，不执行 JS。 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #04120f; }
      .scene { position: fixed; inset: 0; overflow: hidden; }

      .sky {
        position: absolute; inset: -12%;
        background:
          radial-gradient(60% 45% at 18% 12%, rgba(24, 74, 64, 0.85), transparent 72%),
          radial-gradient(52% 42% at 80% 26%, rgba(28, 58, 88, 0.72), transparent 72%),
          radial-gradient(90% 65% at 50% 112%, rgba(10, 34, 30, 0.95), transparent 70%),
          linear-gradient(180deg, #03100e 0%, #071a17 46%, #04120f 100%);
        animation: sky-drift 52s ease-in-out infinite alternate;
      }

      .haze {
        position: absolute; inset: -20%;
        background:
          radial-gradient(40% 30% at 30% 68%, rgba(120, 200, 175, 0.14), transparent 70%),
          radial-gradient(36% 26% at 72% 62%, rgba(150, 190, 230, 0.12), transparent 70%);
        filter: blur(24px);
        animation: haze-drift 38s ease-in-out infinite alternate;
      }

      .ridge {
        position: absolute; left: -6%; right: -6%; bottom: -6%; height: 46%;
        background:
          radial-gradient(50% 100% at 22% 100%, #0b2622 0%, #071a17 60%, transparent 100%),
          radial-gradient(46% 100% at 68% 100%, #0a201d 0%, #061613 62%, transparent 100%);
        filter: blur(2px);
        opacity: 0.92;
      }

      .firefly {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: radial-gradient(circle, #fffdf3 0%, #f2c98a 46%, rgba(242, 201, 138, 0) 72%);
        box-shadow: 0 0 10px 2px rgba(242, 201, 138, 0.38);
        opacity: 0.25;
        animation:
          float var(--d) ease-in-out infinite alternate,
          blink calc(var(--d) / 2) ease-in-out infinite;
        animation-delay: var(--delay), calc(var(--delay) * -0.5);
      }

      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(120% 92% at 50% 44%, transparent 42%, rgba(2, 10, 9, 0.78) 100%);
      }

      @keyframes sky-drift {
        from { transform: translate3d(-1.5%, -1%, 0) scale(1.02); }
        to { transform: translate3d(1.5%, 1.2%, 0) scale(1.06); }
      }

      @keyframes haze-drift {
        from { transform: translate3d(-2%, 0, 0); }
        to { transform: translate3d(2.5%, -1.5%, 0); }
      }

      @keyframes float {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(var(--dx), var(--dy), 0); }
      }

      @keyframes blink {
        0%, 100% { opacity: 0.16; }
        45% { opacity: 0.92; }
        70% { opacity: 0.34; }
      }

      @media (prefers-reduced-motion: reduce) {
        .sky, .haze, .firefly { animation: none; }
        .firefly { opacity: 0.55; }
      }
    </style>
  </head>
