<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声之潮汐</title>
    <style>
      :root {
        --accent: 127, 212, 200;
        --energy: 0;
        --bass: 0;
        --low-mid: 0;
        --mid: 0;
        --high-mid: 0;
        --treble: 0;
        --noise: 0;
        --flash: 0;
      }

      :root[data-palette="ember"] {
        --accent: 232, 160, 112;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04121a;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            circle at 50% 38%,
            rgba(var(--accent), 0.12),
            transparent 58%
          ),
          linear-gradient(180deg, #04121a 0%, #071c26 62%, #04121a 100%);
      }

      .stage {
        position: fixed;
        inset: 0;
        isolation: isolate;
      }

      .mist {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(
            ellipse at 24% 72%,
            rgba(var(--accent), 0.22),
            transparent 55%
          ),
          radial-gradient(
            ellipse at 78% 64%,
            rgba(var(--accent), 0.16),
            transparent 52%
          );
        filter: blur(28px);
        opacity: calc(var(--noise) * 0.75);
        transition: opacity 240ms ease-out;
      }

      .aura,
      .core,
      .flash {
        position: absolute;
        left: 50%;
        top: 44%;
        border-radius: 50%;
        translate: -50% -50%;
        pointer-events: none;
      }

      .aura {
        width: 62vmin;
        height: 62vmin;
        background: radial-gradient(
          circle,
          rgba(var(--accent), 0.42) 0%,
          rgba(var(--accent), 0.12) 46%,
          transparent 70%
        );
        filter: blur(10px);
        opacity: calc(0.16 + var(--energy) * 0.62);
        scale: calc(0.86 + var(--energy) * 0.28);
      }

      .core {
        width: 16vmin;
        height: 16vmin;
        background: radial-gradient(
          circle,
          rgba(240, 255, 252, 0.9) 0%,
          rgba(var(--accent), 0.65) 38%,
          transparent 72%
        );
        opacity: calc(0.25 + var(--energy) * 0.55);
        box-shadow: 0 0 calc(20px + var(--flash) * 90px)
          rgba(var(--accent), calc(0.18 + var(--flash) * 0.55));
        scale: calc(0.9 + var(--bass) * 0.22 + var(--flash) * 0.12);
      }

      .flash {
        width: 150vmax;
        height: 150vmax;
        background: radial-gradient(
          circle,
          rgba(220, 255, 250, 0.22) 0%,
          transparent 58%
        );
        opacity: calc(var(--flash) * 0.7);
      }

      .spectrum {
        position: absolute;
        left: 50%;
        bottom: 14vh;
        display: flex;
        align-items: flex-end;
        gap: 1.6vmin;
        translate: -50% 0;
      }

      /* 显示阈值：与 main.ts 的 FLASH_THRESHOLD 对齐，便于验证柱高是否合理。
         柱轨道 28vmin + 标签/间距 3vmin；0.7444 × 28 + 3 ≈ 23.84vmin。 */
      .spectrum::before {
        content: "";
        position: absolute;
        left: -2vmin;
        right: -2vmin;
        bottom: 23.84vmin;
        border-top: 1px dashed rgba(var(--accent), 0.32);
      }

      .spectrum::after {
        content: "阈值 0.76";
        position: absolute;
        left: calc(100% + 2.4vmin);
        bottom: 23.84vmin;
        translate: 0 50%;
        color: rgba(226, 242, 239, 0.5);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 11px;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .band {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1vmin;
        width: 3vmin;
      }

      .band .track {
        display: flex;
        align-items: flex-end;
        width: 100%;
        height: 28vmin;
      }

      .band i {
        display: block;
        width: 100%;
        min-height: 0.8vmin;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgba(240, 255, 252, 0.92),
          rgba(var(--accent), 0.55)
        );
        box-shadow: 0 0 1.8vmin rgba(var(--accent), 0.35);
        opacity: 0.85;
        height: calc(3% + var(--band) * 94%);
      }

      /* 测试用数值：显示场景实际写入柱高的值（含灵敏度/门限/gamma）。 */
      .band b {
        display: block;
        height: 2vmin;
        line-height: 2vmin;
        color: rgba(226, 242, 239, 0.82);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .band:nth-child(1) {
        --band: var(--bass);
      }
      .band:nth-child(2) {
        --band: var(--low-mid);
      }
      .band:nth-child(3) {
        --band: var(--mid);
      }
      .band:nth-child(4) {
        --band: var(--high-mid);
      }
      .band:nth-child(5) {
        --band: var(--treble);
      }

      .hint {
        position: absolute;
        left: 50%;
        bottom: 5vh;
        margin: 0;
        translate: -50% 0;
        color: rgba(226, 242, 239, 0.66);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-align: center;
        user-select: none;
        white-space: nowrap;
      }

      .hint strong {
        display: block;
        margin-bottom: 6px;
        color: rgba(239, 250, 248, 0.92);
        font-size: 15px;
        font-weight: 500;
      }

      .hint .status {
        opacity: 0.72;
      }

      :root[data-audio="off"] .hint .status::after {
        content: "音频响应暂不可用";
      }
      :root[data-audio="inactive"] .hint .status::after,
      :root[data-audio="not-supported"] .hint .status::after {
        content: "音频引擎未运行";
      }
      :root[data-audio="on"] .hint .status::after {
        content: "正在跟随音乐 / 音境";
      }
      :root[data-audio="unavailable"] .hint .status::after {
        content: "请在 Lull 壁纸窗口中运行";
      }

      @media (prefers-reduced-motion: reduce) {
        .mist {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mist"></div>
      <div class="aura"></div>
      <div class="flash"></div>
      <div class="core"></div>
      <div class="spectrum" aria-hidden="true">
        <div class="band">
          <span class="track"><i></i></span><b data-value="bass">0.00</b>
        </div>
        <div class="band">
          <span class="track"><i></i></span><b data-value="lowMid">0.00</b>
        </div>
        <div class="band">
          <span class="track"><i></i></span><b data-value="mid">0.00</b>
        </div>
        <div class="band">
          <span class="track"><i></i></span><b data-value="highMid">0.00</b>
        </div>
        <div class="band">
          <span class="track"><i></i></span><b data-value="treble">0.00</b>
        </div>
      </div>
      <p class="hint">
        <strong>播放音乐或音境，画面会跟随</strong>
        <span class="status">低频起伏 · 对数五段频谱 · 阈值 0.76 闪光</span>
      </p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
