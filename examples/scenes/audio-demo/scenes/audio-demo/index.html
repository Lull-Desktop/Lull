<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声之潮汐 · Voice Tides</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="声之潮汐：五段音频响应频谱">
      <div class="atmosphere" aria-hidden="true">
        <div class="aura"></div><div class="mist"></div>
        <div class="tides"></div><div class="core"></div><div class="flash"></div>
      </div>
      <section class="visualizer" aria-labelledby="scene-title">
        <h1 id="scene-title">Voice Tides</h1>
        <div class="spectrum" aria-hidden="true">
          <div class="threshold"><span>0.76 Threshold Line<small>Value Display</small></span></div>
          <div class="band">
            <div class="track"><i class="fill"></i><span class="breath"></span></div>
            <b data-value="bass">0.00</b><span class="label">Bass</span>
          </div>
          <div class="band">
            <div class="track"><i class="fill"></i><span class="breath"></span></div>
            <b data-value="lowMid">0.00</b><span class="label">Lowmid</span>
          </div>
          <div class="band">
            <div class="track"><i class="fill"></i><span class="breath"></span></div>
            <b data-value="mid">0.00</b><span class="label">Mid</span>
          </div>
          <div class="band">
            <div class="track"><i class="fill"></i><span class="breath"></span></div>
            <b data-value="highMid">0.00</b><span class="label">Highmid</span>
          </div>
          <div class="band">
            <div class="track"><i class="fill"></i><span class="breath"></span></div>
            <b data-value="treble">0.00</b><span class="label">Treble</span>
          </div>
        </div>
        <p class="legend">0.76 Threshold Line <span>|</span> 0.00 - 1.00 Value Display</p>
        <p class="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
