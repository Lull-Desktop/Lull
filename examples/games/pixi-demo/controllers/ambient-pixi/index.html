<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixi 火星控制器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-engine="pixi">
    <main class="app">
      <header class="head">
        <div>
          <p class="eyebrow">AMBIENT EMBERS · PIXIJS</p>
          <h1 class="title">Pixi 控制台</h1>
        </div>
        <span class="badge" id="status" data-state="connecting">连接中</span>
      </header>

      <p class="hint">
        仅操作 community.pixi-demo；其它游戏实例的状态、seed 与命令互不影响。
      </p>

      <p class="identity" aria-label="实例身份">
        <code id="game-id">--</code> · <code id="instance-id">--</code> · r<span id="revision">--</span>
      </p>

      <section class="stats" aria-label="世界状态">
        <div class="stat">
          <span class="label">亮度</span>
          <strong id="intensity">--</strong>
          <span class="unit">intensity</span>
        </div>
        <div class="stat">
          <span class="label">相位</span>
          <strong id="phase">--</strong>
          <span class="unit">world clock</span>
        </div>
        <div class="stat">
          <span class="label">火星</span>
          <strong id="embers">--</strong>
          <span class="unit">embers</span>
        </div>
        <div class="stat">
          <span class="label">seed</span>
          <strong id="seed">--</strong>
          <span class="unit">layout</span>
        </div>
      </section>

      <section class="actions" aria-label="命令">
        <button type="button" id="pulse" class="primary" disabled>脉冲</button>
        <button type="button" id="reseed" class="secondary" disabled>
          重排火星
        </button>
      </section>

      <section class="feed">
        <p class="feed-label">事件</p>
        <ul class="log" id="log" aria-label="事件日志" aria-live="polite"></ul>
      </section>

      <p class="error" id="error" role="alert"></p>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
