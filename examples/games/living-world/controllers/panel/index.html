<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Living World · Panel</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 12px;
        background: #f6f3ec;
        color: #2b2a26;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
      }
      .hint {
        margin: 0 0 10px;
        color: #8a8578;
        font-size: 11px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 10px;
      }
      .card {
        border: 1px solid #ddd5c6;
        border-radius: 10px;
        background: #fffdf8;
        padding: 7px 8px;
      }
      .card .label {
        color: #8a8578;
        font-size: 10px;
      }
      .card .value {
        margin-top: 2px;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        border: 1px solid #c9bfa8;
        border-radius: 9px;
        background: #f2ecdd;
        color: #2b2a26;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #eae2cf;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .status {
        min-height: 16px;
        margin-bottom: 6px;
        color: #4f6b58;
        font-size: 11px;
      }
      #log {
        height: 132px;
        overflow-y: auto;
        border: 1px dashed #d8d0bf;
        border-radius: 9px;
        padding: 6px 8px;
        color: #6c685d;
        font-family: ui-monospace, SFMono-Regular, menlo, monospace;
        font-size: 10px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Living World 控制台</h1>
    <p class="hint">包内控制器示例：UI 随游戏包分发，只通过宿主壳桥读写游戏。</p>
    <div class="stats">
      <div class="card">
        <div class="label">水分</div>
        <div class="value" id="water">—</div>
      </div>
      <div class="card">
        <div class="label">植物</div>
        <div class="value" id="plants">—</div>
      </div>
      <div class="card">
        <div class="label">繁茂</div>
        <div class="value" id="bloom">—</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="seed">种下种子</button>
      <button type="button" id="water-btn">浇水</button>
    </div>
    <div class="status" id="status">连接中…</div>
    <div id="log"></div>
    <script src="main.js"></script>
  </body>
</html>
