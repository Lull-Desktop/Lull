<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__NAME__</title>
    <style>
      /*
       * Static scene: the iframe runs with sandbox="", so not a single line of script executes.
       * Geometry comes from pure CSS (100% / vw / vh); animation from @keyframes only.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: __BG__;
      }
      .sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 15% 10%, color-mix(in oklab, __ACCENT__ 26%, transparent), transparent 60%),
          radial-gradient(90% 80% at 85% 90%, color-mix(in oklab, __ACCENT__ 18%, transparent), transparent 65%),
          linear-gradient(180deg, __BG__ 0%, color-mix(in oklab, __BG__ 70%, black) 100%);
      }
      .band {
        position: absolute;
        left: -20%;
        width: 140%;
        height: 46vh;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in oklab, __ACCENT__ 30%, transparent),
          transparent
        );
        filter: blur(60px);
        animation: sweep 42s linear infinite;
      }
      .band:nth-child(2) {
        top: 12vh;
        opacity: 0.55;
        animation-duration: 64s;
        animation-direction: reverse;
      }
      .band:nth-child(3) {
        top: 52vh;
        opacity: 0.35;
        animation-duration: 88s;
      }
      @keyframes sweep {
        from {
          transform: translate3d(-6%, 0, 0) skewY(-2deg);
        }
        to {
          transform: translate3d(6%, 0, 0) skewY(2deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .band {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <div class="band"></div>
    <div class="band"></div>
    <div class="band"></div>
  </body>
</html>
