<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d18"/>
      <stop offset="0.55" stop-color="#123a2e"/>
      <stop offset="1" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ea"/>
      <stop offset="1" stop-color="#cfdcc2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0c6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfe0c6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#cfe0c6" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <circle cx="690" cy="320" r="188" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#sky)"/>

  <!-- 星点 -->
  <circle cx="238" cy="214" r="7" fill="#dcead8" opacity="0.55"/>
  <circle cx="318" cy="160" r="4" fill="#dcead8" opacity="0.4"/>
  <circle cx="800" cy="190" r="5" fill="#dcead8" opacity="0.45"/>
  <circle cx="846" cy="286" r="3" fill="#dcead8" opacity="0.35"/>

  <!-- 月牙 -->
  <circle cx="560" cy="410" r="232" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- 薄雾 -->
  <path d="M0 640 C 190 596, 360 700, 540 656 C 720 612, 872 664, 1024 620 L 1024 760 C 860 792, 700 742, 540 782 C 360 826, 180 744, 0 786 Z"
        fill="url(#mist)"/>
  <path d="M0 764 C 200 724, 380 816, 568 774 C 756 732, 892 786, 1024 750 L 1024 884 C 860 912, 700 868, 540 902 C 360 940, 180 872, 0 908 Z"
        fill="url(#mist)" opacity="0.75"/>

  <!-- 竹影：两根细竿与一片叶 -->
  <rect x="806" y="470" width="18" height="430" rx="9" fill="#9fbf96" opacity="0.5"/>
  <rect x="862" y="556" width="10" height="344" rx="5" fill="#9fbf96" opacity="0.32"/>
  <path d="M826 600 C 770 584, 728 548, 690 500 C 742 520, 792 546, 830 586 Z" fill="#b7cfa9" opacity="0.55"/>
  <path d="M826 690 C 774 682, 738 654, 706 616 C 754 630, 796 650, 830 678 Z" fill="#b7cfa9" opacity="0.4"/>
</svg>
