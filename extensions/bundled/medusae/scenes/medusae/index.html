<!doctype html>
<html class="no-js" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>水母</title>
    <link rel="shortcut icon" href="./build/static/img/favicon.ico" />
    <link rel="stylesheet" href="./build/static/css/style.css" />
    <style>
      /* 原作的音频资源已缺失，Audio 按钮保留在 DOM 中（ToggleComponent 构造时读取）但不可见。 */
      #toggle-audio {
        display: none;
      }
    </style>
  </head>
  <body>
    <article id="info" class="modal info-modal">
      <h1>Medusae</h1>
      <div class="info-section">
        <dl>
          <dt>Concept, Design &amp; Code</dt>
          <dd><span>Jay Weeks</span></dd>
        </dl>
        <dl>
          <dt>Audio Design</dt>
          <dd><span>JP Arsenault</span></dd>
        </dl>
      </div>
      <div class="info-section">
        <dl>
          <dt>Physics</dt>
          <dd><span>Particulate</span></dd>
        </dl>
        <dl>
          <dt>Graphics</dt>
          <dd><span>Three</span></dd>
        </dl>
      </div>
      <div class="info-section">
        <dl>
          <dt>Source</dt>
          <dd><span>github.com/jpweeks/particulate-medusae</span></dd>
        </dl>
        <dl>
          <dt>License</dt>
          <dd><span>The Artistic License 2.0</span></dd>
        </dl>
      </div>
    </article>
    <div id="cover-info" class="modal-cover"></div>

    <div id="container-controls" style="visibility: hidden">
      <div id="toggle-info" class="controls-button">
        <div class="label">About</div>
      </div>
      <div id="toggle-dots" class="controls-button">
        <div class="label">Particles</div>
      </div>
      <div id="menu-colors" class="controls-menu"></div>
      <div id="toggle-colors" class="controls-button">
        <div class="label">Colors</div>
      </div>
      <div id="toggle-audio" class="controls-button">
        <div class="label">Audio</div>
      </div>
      <div id="toggle-postfx" class="controls-button">
        <div class="label">Post FX</div>
      </div>
      <div id="toggle-sim" class="controls-button">
        <div class="label">Run Sim</div>
      </div>
    </div>

    <div id="container-stats" class="stats-panel">
      <div id="container-graphs"></div>
      <dl>
        <dt>Particles</dt>
        <dd id="particle-count"></dd>
      </dl>
      <dl>
        <dt>Constraints</dt>
        <dd id="constraint-count"></dd>
      </dl>
      <dl>
        <dt>Forces</dt>
        <dd id="force-count"></dd>
      </dl>
    </div>

    <div id="container"></div>

    <script src="./build/static/js/three.min.js"></script>
    <script src="./build/static/js/app.min.js"></script>
    <script>
      App.STATIC_URL = "./build/static/";
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
